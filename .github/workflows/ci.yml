# Vérifications à chaque push et pull request : types, tests, build. (Le déploiement Vercel se fait indépendamment.)
name: CI
on:
  push:
    branches: [main]
  pull_request:
defaults:
  run:
    working-directory: react
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
